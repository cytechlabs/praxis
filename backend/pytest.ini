[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# PRA-278: quiet default output. `-v` printed every one of 3,400+ passing test
# names on each run, burying real signal in CI logs and local runs. `-q` shows a
# per-test progress char instead; `--tb=short` keeps failures readable; `-rfE`
# gives an end-of-run recap of only failures and errors (the actionable signal);
# `--disable-warnings` drops the multi-hundred-line pre-existing Pydantic-V1
# deprecation dump. Pass/skip/warning COUNTS still print on the summary line.
# Override per-run with `-v` (names) or `-W default` (warnings) when debugging.
addopts = -q -rfE --tb=short --disable-warnings
markers =
    slow: subprocess-heavy integration tests (PRA-157 #6 real debmirror / dnf reposync). Skip during fast iteration with ``pytest -m "not slow"``; the cold-rebuild gate runs them.
