name: DCO

# Enforce Developer Certificate of Origin sign-off on pull requests targeting
# the release lines. Every non-merge commit in the pull request must carry a
# `Signed-off-by:` trailer (see CONTRIBUTING.md). Self-contained shell check:
# no third-party actions and no secrets.

on:
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Make the base branch available locally so we can compute the exact
          # set of commits this pull request adds.
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base="$(git merge-base "refs/remotes/origin/${BASE_REF}" "${HEAD_SHA}")"

          commits="$(git rev-list "${base}..${HEAD_SHA}")"
          if [ -z "${commits}" ]; then
            echo "No commits to check."
            exit 0
          fi

          missing=0
          while read -r sha; do
            [ -n "${sha}" ] || continue
            # Skip merge commits (more than one parent).
            if [ "$(git show -s --format='%P' "${sha}" | wc -w)" -gt 1 ]; then
              continue
            fi
            subject="$(git show -s --format='%s' "${sha}")"
            # PRA-317: exempt Dependabot. Its commits are bot-authored and cannot
            # carry a DCO sign-off, so require both the Dependabot PR actor and
            # its noreply author email. Matching email alone is spoofable.
            # See docs/dependency-security-policy.md.
            author_email="$(git show -s --format='%ae' "${sha}")"
            if [ "${PR_AUTHOR}" = "dependabot[bot]" ]; then
              case "${author_email}" in
                *dependabot\[bot\]@users.noreply.github.com)
                  echo "skip  ${sha}  ${subject}  - Dependabot bot commit (DCO-exempt)"
                  continue
                  ;;
              esac
            fi
            if git show -s --format='%B' "${sha}" \
              | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "ok    ${sha}  ${subject}"
            else
              echo "FAIL  ${sha}  ${subject}  - missing 'Signed-off-by' trailer"
              missing=1
            fi
          done <<< "${commits}"

          if [ "${missing}" -ne 0 ]; then
            echo
            echo "One or more commits are missing a Developer Certificate of Origin sign-off."
            echo "Add a sign-off with 'git commit -s' or 'git rebase --signoff'."
            echo "See CONTRIBUTING.md for details."
            exit 1
          fi
          echo "All commits are signed off."
