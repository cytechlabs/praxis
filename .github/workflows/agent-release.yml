# Agent release pipeline (PRA-152 task #6 + #6b).
#
# Triggered by tags matching `agent-v*` (including RC/prerelease) so
# it doesn't fire on unrelated repo tags. Builds the per-arch
# tarballs + checksums, signs checksums.txt with keyless cosign
# (Sigstore + GitHub OIDC), and uploads all five artifacts to a
# GitHub Release.
#
# Repo identity note: the cosign certificate identity pins to this
# workflow path under cytechlabs/praxis; the verification regex in the
# packaged README must match this path.

name: Agent Release

on:
  push:
    tags:
      - 'agent-v*'

permissions:
  contents: write   # create the GitHub Release + upload assets
  id-token: write   # mint OIDC token for keyless cosign signing

jobs:
  release:
    name: Build + package agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod

      - name: Derive version from tag
        id: ver
        run: |
          # Tag is `agent-vX.Y.Z` -> VERSION=vX.Y.Z
          tag="${GITHUB_REF_NAME}"
          version="${tag#agent-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_name=Agent $version" >> "$GITHUB_OUTPUT"

      - name: Build + package
        run: make release VERSION=${{ steps.ver.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign checksums.txt (keyless, OIDC)
        # `--yes` skips the keyless interactive confirmation. Failure
        # here aborts the job — we never ship unsigned artifacts that
        # look signed by default later.
        run: |
          cosign sign-blob \
            --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Show artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.ver.outputs.release_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            agent/dist/praxis-agent-${{ steps.ver.outputs.version }}-linux-amd64.tar.gz
            agent/dist/praxis-agent-${{ steps.ver.outputs.version }}-linux-arm64.tar.gz
            agent/dist/checksums.txt
            agent/dist/checksums.txt.sig
            agent/dist/checksums.txt.pem
