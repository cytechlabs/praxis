name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    # PRA-345/PRA-270: `main` is the CI-gated integration branch and
    # `release/**` are frozen backport lines, but normal working branches also
    # run push CI so slices get feedback before opening a PR. The GitFlow-era
    # permanent `dev` and milestone `m*/**` branches remain retired.
    branches: [main, 'release/**', 'feature/**', 'bug/**', 'fix/**', 'security/**', 'hotfix/**']

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'  # PRA-321: run backend CI on the shipped 3.14 runtime
          cache: 'pip'

      - name: Install linting tools
        run: pip install "black==26.5.1" "isort==5.13.2"

      - name: Check formatting (black)
        run: black --check .

      - name: Check import sorting (isort)
        run: isort --check --profile black --settings-path setup.cfg .

  # PRA-278: pylint runs as its own lane so a style regression fails fast and
  # independently of the (slower) test lanes below. It imports `app`, so it still
  # needs the full backend dependency set installed.
  backend-pylint:
    name: Backend Pylint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'  # PRA-321: run backend CI on the shipped 3.14 runtime
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install pylint

      - name: Lint (pylint)
        run: pylint app --fail-under=5.0

      # Unused imports are gated on their own, with no score threshold, so a new
      # one fails the build instead of being absorbed into an aggregate score.
      # The scope is wider than the lane above because dead imports accumulate
      # fastest in tests and one-off scripts.
      #
      # Imports kept deliberately (model registration for Base.metadata, package
      # re-exports) must carry `# pylint: disable=unused-import` on the import
      # statement. Add `# noqa: F401` alongside it when the same import also
      # needs to stay silent for the hosted analyzer, which honours noqa but not
      # the pylint pragma.
      #
      # `__init__.py` files are exempt via `init-import=no` in .pylintrc; their
      # re-exports are declared in `__all__` instead.
      - name: Lint unused imports (pylint W0611)
        run: pylint --disable=all --enable=unused-import --score=n app alembic tests scripts

  # PRA-278: the backend test suite (3,400+ tests) is split into parallel lanes
  # so a failure in one area returns without waiting on the whole monolith, and
  # the slowest lane — not the sum of all tests — sets wall-clock feedback time.
  # Lanes are path-based and mutually exhaustive: `services` + `api` + everything
  # else (broker/db/cli/integration via --ignore). Using --ignore for the `rest`
  # lane means any NEW top-level tests/ directory is still gated (it falls into
  # `rest`), so the split can never silently drop release coverage. fail-fast is
  # off so every lane reports independently.
  backend-test:
    name: Backend Test (${{ matrix.lane }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: services
            paths: tests/services
          - lane: api
            paths: tests/api
          - lane: rest
            paths: tests --ignore=tests/services --ignore=tests/api
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/praxis
      SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: testing

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'  # PRA-321: run backend CI on the shipped 3.14 runtime
          cache: 'pip'

      - name: Install dependencies
        # coverage is pinned: each lane writes a data file that a later job
        # combines, and combining requires the same data format everywhere.
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov "coverage==7.15.4"

      - name: Run tests (${{ matrix.lane }})
        # --tb=short is also in pytest.ini addopts; kept here so the CI command is
        # self-documenting. Slow (subprocess) + integration tests stay in-gate:
        # slow lives under tests/services and integration under `rest` (it
        # self-skips unless PRAXIS_E2E=1).
        #
        # A bare --cov takes its source and path mapping from
        # backend/.coveragerc, so every lane measures the whole app package
        # rather than only the modules that lane imports. No report is written
        # here: the lanes are partial by design and only the combined data of
        # all three describes the suite.
        env:
          COVERAGE_FILE: .coverage.${{ matrix.lane }}
        run: |
          alembic upgrade head
          pytest --tb=short --cov --cov-report= ${{ matrix.paths }}

      - name: Upload coverage data (${{ matrix.lane }})
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-python-${{ matrix.lane }}
          path: backend/.coverage.${{ matrix.lane }}
          # The data file name starts with a dot, which the upload action
          # skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  agent-build:
    # PRA-152 task #1: Go toolchain lane. Runs gofmt diff, go vet,
    # golangci-lint, go test, and cross-compiles for both target
    # architectures. Cross-compile only — no QEMU runner. Pinned
    # golangci-lint version matches agent/Dockerfile.dev so local +
    # CI lint diffs stay aligned.
    name: Agent Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Go toolchain
        id: go
        run: echo "version=$(tr -d '[:space:]' < GO_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          # agent/GO_VERSION, not go.mod: this lane must build with the same
          # exact patch release the release workflow publishes from, so a
          # toolchain regression is caught on PRs rather than at release.
          go-version: ${{ steps.go.outputs.version }}
          check-latest: false
          # cache-dependency-path defaults to go.sum; setup-go skips
          # caching gracefully when it's missing (zero deps right now).

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          # `git diff` covers tracked files; if tidy materialised a
          # go.sum that wasn't tracked, surface that too.
          git diff --exit-code
          if [ -f go.sum ] && ! git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            echo "go.sum was created by 'go mod tidy' but is not tracked — commit it"
            exit 1
          fi

      - name: Check formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt would reformat the following files:"
            gofmt -l .
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        # golangci-lint v2.x is the first line that supports Go 1.26.
        # v2.11 pinned for reproducibility and matches the version
        # baked into agent/Dockerfile.dev.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.0
          working-directory: agent
          args: --timeout 5m

      - name: Test
        # -coverpkg widens measurement to every package in the module, so a
        # package with no tests of its own is reported at zero instead of being
        # left out of the profile entirely.
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-go
          path: agent/coverage.out
          if-no-files-found: error
          retention-days: 1

      - name: Cross-compile (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o /tmp/praxis-agent-amd64 ./cmd/praxis-agent

      - name: Cross-compile (linux/arm64)
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags "-s -w" -o /tmp/praxis-agent-arm64 ./cmd/praxis-agent

      - name: Smoke (host arch)
        run: |
          go build -trimpath -ldflags "-s -w -X main.Version=ci -X main.Commit=$(git rev-parse HEAD)" -o /tmp/praxis-agent ./cmd/praxis-agent
          /tmp/praxis-agent --version

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint src

      # PRA-268: block raw red-*/blue-*/#DC2626 in the foundation surfaces
      # (semantic tokens + shared primitives + shell). Feature pages are out of
      # scope until the PRA-270+ sweeps. See docs/design/ui-foundation.md.
      - name: Color-drift guardrail (foundation)
        run: npm run check:colors

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      # The frontend unit-test lane. It runs with coverage on, and measures
      # every module under src/ rather than only the ones a test imports, so
      # the reported number describes the shipped app instead of the tested
      # subset.
      - name: Unit tests (Vitest)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-javascript
          path: frontend-next/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  # The test lanes above each measure one language and hand their raw report
  # on; this job turns them into one report per language for the commit that
  # was tested, and refuses reports that do not describe that commit. It holds
  # no upload credential: it runs repository code, including code a pull
  # request is free to change, so it is kept unprivileged and its only output
  # is data.
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [backend-test, agent-build, frontend-checks]
    permissions:
      contents: read
    env:
      PYTHON_REPORT: coverage-python.xml
      JAVASCRIPT_REPORT: coverage-artifacts/coverage-javascript/lcov.info
      GO_REPORT: coverage-artifacts/coverage-go/coverage.out
      # A Go profile addresses code by import path. Stripping this prefix is
      # what turns those into repository paths, and it is the same root the
      # hosted Go analyzer is configured with.
      GO_IMPORT_ROOT: github.com/cytechlabs/praxis

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install coverage
        # Pinned to the version the backend lanes measured with; combining data
        # files across versions is not supported.
        run: pip install "coverage==7.15.4"

      - name: Download the lane reports
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Combine the backend lanes
        # The lane set is asserted rather than globbed blindly: adding a lane to
        # the backend matrix without adding it here would otherwise publish a
        # measurement smaller than the suite actually produced, and it would
        # look like a coverage regression rather than a wiring mistake.
        run: |
          set -euo pipefail
          expected="api rest services"
          found=$(ls -d coverage-artifacts/coverage-python-*/ \
            | sed 's|.*/coverage-python-||; s|/$||' | sort | tr '\n' ' ' | sed 's| $||')
          if [ "$found" != "$expected" ]; then
            echo "backend coverage lanes changed: expected '$expected', found '$found'"
            exit 1
          fi
          coverage combine --rcfile=backend/.coveragerc --data-file=coverage-python.data \
            coverage-artifacts/coverage-python-*/.coverage.*
          coverage xml --rcfile=backend/.coveragerc --data-file=coverage-python.data -o "$PYTHON_REPORT"
          echo "backend line coverage: $(coverage report --rcfile=backend/.coveragerc \
            --data-file=coverage-python.data --format=total)%"

      - name: Check the reports describe this checkout
        # Every reported path has to resolve to a file in this commit. A report
        # whose paths are relative to a workspace directory, or that measured
        # nothing at all, uploads cleanly and then reads as real coverage, so it
        # is rejected here instead.
        run: |
          set -euo pipefail
          node scripts/normalize-coverage-paths.mjs --self-test
          node scripts/normalize-coverage-paths.mjs --format cobertura "$PYTHON_REPORT"
          node scripts/normalize-coverage-paths.mjs --format lcov --prefix frontend-next "$JAVASCRIPT_REPORT"
          node scripts/normalize-coverage-paths.mjs --format go --import-root "$GO_IMPORT_ROOT" "$GO_REPORT"

      - name: Stage the validated reports
        # One artifact, three files, fixed names. This is the whole interface to
        # the publishing job, which reads these as data and runs none of the
        # code that produced them.
        run: |
          set -euo pipefail
          mkdir -p coverage-reports
          cp "$PYTHON_REPORT" coverage-reports/python.xml
          cp "$JAVASCRIPT_REPORT" coverage-reports/javascript.lcov
          cp "$GO_REPORT" coverage-reports/go.out

      - name: Upload the validated reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-reports
          path: coverage-reports/
          if-no-files-found: error
          retention-days: 1

      - name: Note that this run does not publish
        if: github.event_name != 'push'
        run: |
          echo "Reports were rebuilt and checked but not published: a pull request"
          echo "run measures GitHub's merge checkout, which is not the commit that"
          echo "gets analysed. Coverage for this branch is published by its own"
          echo "push run, if the branch name matches this workflow's push filter."

  # Publishing is split out because it is the only part that holds a
  # credential. It runs on pushes alone, checks out nothing, and runs no
  # repository code: it downloads the validated reports as data and hands them
  # to the uploader. That keeps the OIDC token away from code a pull request
  # can change.
  coverage-publish:
    name: Publish Coverage
    runs-on: ubuntu-latest
    needs: coverage-report
    # Reporting contract, and its limits:
    #   - main publishes the authoritative merged measurement;
    #   - the branch families in this workflow's push filter publish coverage
    #     for their own push SHA, which is the SHA a pull request from them is
    #     analysed at;
    #   - pull request runs validate the reports and publish nothing, because
    #     their checkout is GitHub's merge commit rather than the analysed
    #     commit;
    #   - branches outside the push filter, including Dependabot branches and
    #     any other unmatched name, publish nothing at all, and neither do
    #     forks, whose tokens cannot be granted id-token: write.
    # The gap for unmatched branches and forks is deliberate: closing it would
    # mean granting the upload credential to untrusted pull request events. It
    # is a known reporting limitation for as long as coverage gates stay off.
    if: github.event_name == 'push'
    permissions:
      contents: read
      # The uploader trades this token for a short-lived credential, so no
      # coverage secret is stored on the repository.
      id-token: write

    steps:
      - name: Download the validated reports
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-reports
          path: coverage-reports

      - name: Install the coverage uploader
        # Downloaded first and run second, so a connection that drops mid
        # transfer cannot leave a half-read script executing. The installer
        # verifies the checksum of the binary it fetches.
        run: |
          set -euo pipefail
          curl -fsSL https://cli.deepsource.com/install -o "$RUNNER_TEMP/install-uploader.sh"
          BINDIR="$RUNNER_TEMP/deepsource" sh "$RUNNER_TEMP/install-uploader.sh"

      - name: Publish coverage
        # --commit is what makes this safe to run without a checkout: the
        # uploader skips git detection entirely and files the reports against
        # the pushed commit, which is exactly the tree they were measured from.
        run: |
          set -euo pipefail
          for report in python.xml javascript.lcov go.out; do
            if [ ! -s "coverage-reports/$report" ]; then
              echo "coverage-reports/$report is missing or empty"
              exit 1
            fi
          done
          publish() {
            "$RUNNER_TEMP/deepsource/deepsource" report \
              --analyzer test-coverage \
              --use-oidc \
              --commit "$GITHUB_SHA" \
              --key "$1" \
              --value-file "$2"
          }
          publish python coverage-reports/python.xml
          publish javascript coverage-reports/javascript.lcov
          publish go coverage-reports/go.out

  # The documentation site is built from docs/ and shipped two ways: published
  # on the public docs domain, and committed under frontend-next/public/help/
  # so the frontend image serves it offline. The bundled copy has to be
  # committed because the frontend image is built with frontend-next/ as its
  # Docker context and cannot reach docs/. This lane is what stops that
  # committed copy from going stale or diverging from the public site.
  #
  # Only first-party actions/* are used here; no third-party action is
  # introduced that would need SHA pinning.
  docs-build:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      # Rendering a Mermaid diagram needs a headless browser. Building the site
      # does not: diagrams are rendered ahead of time and committed, so the
      # public site can be built by a host that has no browser and no way to
      # install one. This lane still renders them, to prove the committed files
      # are what the current source produces.
      - name: Install the diagram render browser
        working-directory: docs-site
        run: npx playwright install --with-deps chromium

      # Geometry does not depend on the runner's fonts: rendering measures with
      # a font from node_modules, which is what makes this comparison stable.
      - name: Rendered diagrams match their source
        run: node scripts/build-docs-diagrams.mjs --check

      - name: Content and type check (astro check)
        working-directory: docs-site
        run: npx astro check

      # Only the public site is built here. Building the bundled copy would
      # overwrite the committed one and make the freshness check below
      # vacuous; that check does its own build into a temporary directory.
      # A cold-cache build, proving the route set comes from the repository
      # rather than from a populated Astro cache or a file that exists only on
      # one machine. This runs first so a discovery problem fails before the
      # gates that depend on a build.
      - name: Clean build produces the reviewed route set
        run: node scripts/check-docs-clean-build.mjs

      - name: Build the public site
        run: node scripts/build-docs.mjs --public

      # Fixtures first: prove the leak detection still rejects real token
      # shapes and personal paths, and still allows documented placeholders,
      # before trusting it against the real content.
      - name: Public content check self-test
        run: node scripts/check-docs-public-content.mjs --self-test

      - name: Public content boundary
        run: node scripts/check-docs-public-content.mjs

      - name: Links and anchors (public site)
        run: node scripts/check-docs-links.mjs docs-site/dist

      - name: Links and anchors (bundled copy)
        run: node scripts/check-docs-links.mjs frontend-next/public/help --base /help

      # A Mermaid fence that failed to render still builds a valid page; it
      # just ships the diagram source as a code block. Nothing else notices.
      - name: Diagrams rendered (public site)
        run: node scripts/check-docs-diagrams.mjs docs-site/dist

      - name: Diagrams rendered (bundled copy)
        run: node scripts/check-docs-diagrams.mjs frontend-next/public/help --base /help

      # Pagefind encodes page ordinals into its index chunks, so indexing in
      # filesystem order produces a bundle that cannot be reproduced on a
      # different filesystem. This proves the ordering is normalised.
      - name: Search index is independent of discovery order
        run: node scripts/check-docs-search-order.mjs docs-site/dist

      - name: Search index (public site)
        run: node scripts/check-docs-search.mjs docs-site/dist

      - name: Search index (bundled copy)
        run: node scripts/check-docs-search.mjs frontend-next/public/help --base /help

      # Rebuilds the bundled copy into a temporary directory and fails if the
      # committed bytes differ, then compares the two builds page by page.
      - name: Bundled copy is current and matches the public site
        run: node scripts/check-docs-bundle.mjs

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PRA-299: the dev Dockerfiles are retired — local and release builds both
      # use the production Dockerfiles (the canonical production-parity path). This
      # lane builds them as a fast "does it build" smoke; the Container Security
      # Scan lane also builds + scans the same prod images.
      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod backend/

      - name: Build frontend image
        run: docker build -f frontend-next/Dockerfile.prod frontend-next/

  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build backend prod image
        run: docker build -f backend/Dockerfile.prod -t praxis-backend:scan backend/

      - name: Build frontend prod image
        run: docker build -f frontend-next/Dockerfile.prod -t praxis-frontend:scan frontend-next/

      # PRA-121: Fail the pipeline on any CRITICAL CVE. HIGH is reported
      # via the SARIF upload below but not gated so we don't block on
      # upstream noise we can't immediately fix.
      - name: Trivy gate (backend) — fail on CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: praxis-backend:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy gate (frontend) — fail on CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: praxis-frontend:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      # Full SARIF reports saved as build artifacts (download to inspect).
      # NOTE: surfacing these in the GitHub Security tab (code scanning)
      # requires GitHub Advanced Security. Where GHAS is available, add a
      # `github/codeql-action/upload-sarif@v3` step for each SARIF file.
      - name: Trivy SARIF (backend)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: praxis-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Trivy SARIF (frontend)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: praxis-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      # CycloneDX SBOM for each image, archived as a build artifact. On
      # tag push, publish.yml regenerates these and attaches them to the
      # GitHub Release.
      - name: SBOM (backend, CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: praxis-backend:scan
          format: cyclonedx
          output: sbom-backend.cdx.json

      - name: SBOM (frontend, CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: praxis-frontend:scan
          format: cyclonedx
          output: sbom-frontend.cdx.json

      - name: Upload SBOMs + SARIF as artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: security-reports
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json
            trivy-backend.sarif
            trivy-frontend.sarif
          retention-days: 30

  # PRA-317: repo/filesystem dependency scan — the source-level counterpart to
  # the image Trivy gates above. It scans the dependency manifests/lockfiles
  # (backend pip, frontend npm) AND the AGENT Go modules. The shipped agent is a
  # tarball binary, not a container image, so this filesystem scan is the agent's
  # 1.0 vulnerability gate. Posture matches the image gates: CRITICAL blocks;
  # HIGH is report-only via SARIF (avoid blocking on upstream noise we can't
  # immediately fix — Dependabot drives the HIGH backlog down over time).
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem gate — fail on CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # Full CRITICAL/HIGH/MEDIUM report saved as an artifact (download to
      # inspect). As with the image SARIF, surfacing this in the GitHub Security
      # tab requires GitHub Advanced Security; add a
      # github/codeql-action/upload-sarif step where GHAS is available.
      - name: Trivy filesystem SARIF (CRITICAL/HIGH/MEDIUM)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Upload filesystem scan SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-scan-reports
          path: trivy-fs.sarif
          retention-days: 30
          if-no-files-found: warn
